[package]
name = "local-tasks"
version = "1.0.0"
description = "Privacy-First Offline Task Manager"
authors = ["LocalTasks"]
edition = "2021"

[lib]
name = "local_tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
